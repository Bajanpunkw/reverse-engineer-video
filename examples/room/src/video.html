<script type="module">
// A room in code: a desk corner by the window, low sun through venetian blinds, light and render modes. A frame depends only on t.
// Horizontal: node scripts/render.cjs examples/room/src out.mp4 --end 20 --size 1920x1080
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
Math.random = mulberry32(424242);           // GTAO noise is identical across render workers
const rnd = mulberry32(7);
const R = (a, b) => a + (b - a) * rnd();
const W = 1920, H = 1080, DUR = 20;

await document.fonts.load('500 20px UI'); await document.fonts.load('700 40px UI');

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
RectAreaLightUniformsLib.init();
const scene = new THREE.Scene();
const room = new THREE.Group(); scene.add(room);
const camera = new THREE.PerspectiveCamera(72, W / H, 0.03, 40);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- textures (canvas, seeded) ----------
function ctex(w, h, draw, rep = [1, 1], srgb = true){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); t.anisotropy = 8; return t;
}
function grain(g, w, h, n, rgb, a0, a1, horiz = true){
  for (let i = 0; i < n; i++){
    const y = rnd() * (horiz ? h : w), a = R(a0, a1);
    g.strokeStyle = `rgba(${rgb},${a})`; g.lineWidth = R(.6, 3); g.beginPath();
    const amp = R(1, 6), f = R(.004, .02), ph = R(0, 6);
    for (let s = 0; s <= 40; s++){ const x = s / 40 * (horiz ? w : h), yy = y + Math.sin(x * f + ph) * amp;
      horiz ? (s ? g.lineTo(x, yy) : g.moveTo(x, yy)) : (s ? g.lineTo(yy, x) : g.moveTo(yy, x)); }
    g.stroke();
  }
}
const woodTex = (base, dark, rep = [1, 1]) => ctex(512, 512, (g, w, h) => { g.fillStyle = base; g.fillRect(0, 0, w, h); grain(g, w, h, 220, dark, .03, .12); }, rep);
const noiseFill = (g, w, h, base, rgb, n, a) => { g.fillStyle = base; g.fillRect(0, 0, w, h); for (let i = 0; i < n; i++){ g.fillStyle = `rgba(${rgb},${R(0, a)})`; const s = R(1, 3); g.fillRect(rnd() * w, rnd() * h, s, s); } };

const plasterTex = ctex(512, 512, (g, w, h) => noiseFill(g, w, h, '#a9aaa4', '75,75,70', 9000, .10), [3, 2]);
const marbleTex = ctex(1024, 512, (g, w, h) => {
  noiseFill(g, w, h, '#ecebe7', '150,150,150', 6000, .05);
  for (let i = 0; i < 14; i++){ g.strokeStyle = `rgba(120,118,122,${R(.05, .16)})`; g.lineWidth = R(.5, 2.2); g.beginPath();
    let x = rnd() * w, y = rnd() * h; g.moveTo(x, y); for (let k = 0; k < 8; k++){ x += R(40, 160); y += R(-60, 60); g.lineTo(x, y); } g.stroke(); }
});
const floorTex = ctex(1024, 1024, (g, w, h) => {
  const rows = 8, ph = h / rows;
  for (let r = 0; r < rows; r++){ let x = -R(0, 300); while (x < w){ const len = R(260, 520), tone = R(-14, 14);
    g.fillStyle = `rgb(${196 + tone},${170 + tone},${136 + tone})`; g.fillRect(x, r * ph, len, ph);
    g.save(); g.beginPath(); g.rect(x, r * ph, len, ph); g.clip(); g.translate(0, r * ph); grain(g, w, ph, 40, '110,80,50', .03, .10); g.restore();
    g.fillStyle = 'rgba(60,40,25,.35)'; g.fillRect(x, r * ph, 2, ph); x += len; }
    g.fillStyle = 'rgba(60,40,25,.4)'; g.fillRect(0, r * ph, w, 2); }
}, [2.5, 2.5]);
const outsideDay = ctex(1024, 640, (g, w, h) => {

});
const outsideNight = ctex(1024, 640, (g, w, h) => {

  g.filter = 'blur(3px)'; for (let i = 0; i < 26; i++){ g.fillStyle = `rgba(255,${R(170, 210) | 0},120,${R(.4, .9)})`; g.fillRect(rnd() * w, R(.4, .95) * h, R(6, 14), R(8, 16)); } g.filter = 'none';
});
const screenTex = ctex(1600, 920, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#9cc7f0'); gr.addColorStop(.55, '#f7d6a8'); gr.addColorStop(1, '#f08a3c'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  // terminal window: Claude Code

  g.strokeStyle = '#d97757'; g.lineWidth = 3; g.beginPath(); g.roundRect(100, 150, 760, 120, 10); g.stroke();
  g.fillStyle = '#d97757'; g.font = '700 36px UI'; g.fillText('*  Welcome to Claude Code', 130, 200);
  g.fillStyle = '#9b958f'; g.font = '500 24px UI'; g.fillText('/help for help · cwd: ~/room', 130, 240);
  let y = 320;
  const lines = [['#e8e4df', '> build my room in three.js, sun through the blinds'], ['#d97757', '● Write(room/scene.js)'], ['#8bc48a', '  + desk, monitor, blinds, shelf, plant'], ['#d97757', '● Write(room/light.js)'], ['#8bc48a', '  + low sun · evening · night'], ['#e8e4df', '  shadows through 45 slats, soft bounce'], ['#d97757', '● Bash(npm run dev)'], ['#9b958f', '  ready on localhost:5173'], ['#e8e4df', '> make the evening warmer']];
  for (const [c, s] of lines){ g.fillStyle = c; g.font = '500 27px UI'; g.fillText(s, 110, y); y += 52; }

  rr(965, 220, 540, 330, 10, '#27211c');
  const sg = g.createLinearGradient(965, 220, 1505, 550); sg.addColorStop(0, '#5b4330'); sg.addColorStop(1, '#1d1712'); rr(965, 220, 540, 330, 10, sg);
  for (let i = 0; i < 9; i++){ g.fillStyle = `rgba(255,190,110,${.55 - i * .04})`; g.fillRect(1120 + i * 6, 250 + i * 26, 190, 9); }
  for (let i = 0; i < 6; i++) rr(965, 575 + i * 28, R(200, 520), 12, 6, '#d9d6d0');
});
const artTex = ctex(400, 500, (g, w, h) => { g.fillStyle = '#efe9dd'; g.fillRect(0, 0, w, h); g.fillStyle = '#d4693f'; g.beginPath(); g.arc(w * .55, h * .42, 95, 0, 7); g.fill(); g.fillStyle = '#2f3b4a'; g.fillRect(60, h * .62, w - 120, 18); g.fillStyle = '#b9b2a4'; g.fillRect(60, h * .7, w * .5, 10); });
const corkTex = ctex(400, 300, (g, w, h) => { noiseFill(g, w, h, '#a8825a', '70,45,20', 5000, .35); });

// ---------- materials ----------
const std = (o) => new THREE.MeshStandardMaterial(o);

  ceil: std({ color: 0xe9e6e0, roughness: .95 }),
  floor: std({ map: floorTex, roughness: .55 }),

  fabric: std({ color: 0x3b3c40, roughness: .9 }),
  leaf: std({ color: 0x3f6b2a, roughness: .55, side: THREE.DoubleSide }),
  stem: std({ color: 0x4d6b2e, roughness: .7 }),

  art: std({ map: artTex, roughness: .8 }),
  cork: std({ map: corkTex, roughness: .95 }),
  rug: std({ color: 0x8d8a84, roughness: 1 }),
  bulb: new THREE.MeshBasicMaterial({ color: 0xfff1d6 }),
  screen: new THREE.MeshBasicMaterial({ map: screenTex }),
};
M.screen.color.setScalar(1.25);

// ---------- helpers ----------
function add(geo, mat, x, y, z, o = {}){
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (o.rot) m.rotation.set(...o.rot);
  m.castShadow = o.cast !== false; m.receiveShadow = true; (o.parent || room).add(m); return m;
}
const box = (w, h, d, mat, x, y, z, o) => add(new THREE.BoxGeometry(w, h, d), mat, x, y, z, o);
const rbox = (w, h, d, r, mat, x, y, z, o) => { const m = add(new RoundedBoxGeometry(w, h, d, 3, r), mat, x, y, z, o); m.userData.edge = new THREE.BoxGeometry(w, h, d); return m; }; // wireframe mode uses the edges of a plain box
const cyl = (r1, r2, h, mat, x, y, z, o) => { const m = add(new THREE.CylinderGeometry(r1, r2, h, 32), mat, x, y, z, o); m.userData.edge = new THREE.CylinderGeometry(r1, r2, h, 8); return m; };
function rod(a, b, r, mat, parent = room){
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 14), mat);
  m.position.copy(A).add(B).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
  m.castShadow = m.receiveShadow = true; m.userData.edge = new THREE.CylinderGeometry(r, r, A.distanceTo(B), 5); parent.add(m); return m;
}
function instanced(geo, mat, list, o = {}){ // list: [{p:[x,y,z], s:[sx,sy,sz], r:[rx,ry,rz], c:hex}]
  const m = new THREE.InstancedMesh(geo, mat, list.length), d = new THREE.Object3D();
  list.forEach((it, i) => { d.position.set(...it.p); d.scale.set(...(it.s || [1, 1, 1])); d.rotation.set(...(it.r || [0, 0, 0])); d.updateMatrix(); m.setMatrixAt(i, d.matrix); if (it.c !== undefined) m.setColorAt(i, new THREE.Color(it.c)); });
  m.castShadow = o.cast !== false; m.receiveShadow = true; (o.parent || room).add(m); return m;
}
function leafGeo(len, wid){
  const s = new THREE.Shape(); s.moveTo(0, 0); s.bezierCurveTo(wid * .62, len * .12, wid * .55, len * .72, 0, len); s.bezierCurveTo(-wid * .55, len * .72, -wid * .62, len * .12, 0, 0);
  const g = new THREE.ShapeGeometry(s, 12); const p = g.attributes.position; // slight leaf curl
  for (let i = 0; i < p.count; i++){ const x = p.getX(i), y = p.getY(i); p.setZ(i, -Math.abs(x) * .35 + (y / len) * (y / len) * len * .18); }
  g.computeVertexNormals(); return g;
}
